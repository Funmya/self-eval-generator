<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自己評価ジェネレーター</title>
  <style>
    :root {
      --splat-black: #111116;
      --splat-card-bg: #1e1e24;
      --splat-pink: #ff007f;
      --splat-yellow: #e6fb04;
      --splat-purple: #9d00ff;
      --splat-cyan: #00f0ff;
      --splat-white: #f0f0f8;
      --border-color: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', 'Impact', sans-serif;
    }

    body {
      background-color: var(--splat-black);
      background-image: 
        radial-gradient(var(--splat-purple) 15%, transparent 16%),
        radial-gradient(var(--splat-pink) 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      color: var(--splat-white);
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      background: var(--splat-yellow);
      color: var(--splat-black);
      border: 4px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 6px 6px 0 var(--splat-pink);
      transform: rotate(-1deg);
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 var(--splat-white);
    }

    p.subtitle {
      font-weight: bold;
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--splat-card-bg);
      border: 4px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 6px 6px 0 var(--splat-purple);
      margin-bottom: 24px;
      position: relative;
    }

    .card-title {
      display: inline-block;
      background: var(--splat-pink);
      color: var(--splat-white);
      padding: 6px 18px;
      border-radius: 8px;
      border: 3px solid var(--border-color);
      font-size: 1.1rem;
      font-weight: 900;
      margin-bottom: 16px;
      transform: rotate(-2deg);
      box-shadow: 3px 3px 0 var(--border-color);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 6px;
      color: var(--splat-yellow);
    }

    input[type="date"],
    input[type="password"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 3px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      background: #ffffff;
      color: #000;
      font-weight: bold;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      box-shadow: 0 0 0 4px var(--splat-cyan);
    }

    textarea {
      resize: vertical;
    }

    .btn {
      display: inline-block;
      width: 100%;
      background-color: var(--splat-yellow);
      color: var(--splat-black);
      border: 3px solid var(--border-color);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--border-color);
      transition: all 0.1s ease;
      text-align: center;
    }

    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--border-color);
      background-color: #f7ff42;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-color);
    }

    .btn-secondary {
      background-color: var(--splat-cyan);
      color: var(--splat-black);
    }

    .btn-edit {
      background-color: var(--splat-yellow);
      color: var(--splat-black);
      width: auto;
      padding: 4px 10px;
      font-size: 0.8rem;
      box-shadow: 2px 2px 0 var(--border-color);
    }

    .btn-danger {
      background-color: var(--splat-pink);
      color: var(--splat-white);
      width: auto;
      padding: 4px 10px;
      font-size: 0.8rem;
      box-shadow: 2px 2px 0 var(--border-color);
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .log-list {
      max-height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .log-item {
      background: #2a2a32;
      border: 3px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      box-shadow: 3px 3px 0 var(--splat-cyan);
    }

    .log-date {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--splat-cyan);
      margin-bottom: 4px;
    }

    .log-content {
      white-space: pre-wrap;
      font-size: 0.9rem;
      color: var(--splat-white);
    }

    .output-box {
      white-space: pre-wrap;
      background: #ffffff;
      color: #000000;
      font-weight: 500;
      padding: 16px;
      border-radius: 10px;
      min-height: 220px;
      font-size: 0.95rem;
      border: 4px solid var(--border-color);
      box-shadow: inset 3px 3px 0 rgba(0,0,0,0.1);
    }

    .edit-textarea {
      width: 100%;
      margin-bottom: 8px;
    }

    /* イカバトル・ローディングアニメーション */
    .splat-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 10px;
      gap: 16px;
    }

    .squid-battle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 220px;
      font-size: 2.5rem;
      position: relative;
    }

    .squid-left {
      animation: attack-left 0.8s infinite alternate ease-in-out;
      transform: scaleX(-1);
    }

    .squid-right {
      animation: attack-right 0.8s infinite alternate ease-in-out 0.4s;
    }

    .ink-ball {
      font-size: 1.2rem;
      position: absolute;
      top: 30%;
      opacity: 0;
    }

    .ink-pink {
      left: 20%;
      animation: fly-pink 0.8s infinite ease-in-out;
    }

    .ink-green {
      right: 20%;
      animation: fly-green 0.8s infinite ease-in-out 0.4s;
    }

    .loading-text {
      font-weight: 900;
      color: var(--splat-purple);
      font-size: 1.1rem;
      animation: blink 1s infinite alternate;
    }

    @keyframes attack-left {
      0% { transform: scaleX(-1) translateX(0) rotate(0deg); }
      100% { transform: scaleX(-1) translateX(-15px) rotate(-15deg); }
    }

    @keyframes attack-right {
      0% { transform: translateX(0) rotate(0deg); }
      100% { transform: translateX(-15px) rotate(-15deg); }
    }

    @keyframes fly-pink {
      0% { left: 25%; opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.4) translateY(-10px); }
      100% { left: 70%; opacity: 0; transform: scale(0.8); }
    }

    @keyframes fly-green {
      0% { right: 25%; opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.4) translateY(-10px); }
      100% { right: 70%; opacity: 0; transform: scale(0.8); }
    }

    @keyframes blink {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>自己評価ジェネレーター</h1>
    <p class="subtitle">日々の雑感・実績メモを記録し、半期ごとの自己評価文章をAIが自動作成！</p>
  </header>

  <div class="card" style="box-shadow: 6px 6px 0 var(--splat-cyan);">
    <div class="card-title" style="background: var(--splat-cyan); color: #000;">1. API KEY SETUP</div>
    <div class="form-group" style="margin: 0;">
      <label for="apiKey">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="AI StudioのAPIキーを入力">
    </div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <div class="card-title">2. メモを記録</div>
        <form id="memoForm">
          <div class="form-group">
            <label for="memoDate">日付</label>
            <input type="date" id="memoDate" required>
          </div>
          <div class="form-group">
            <label for="memoText">今日やったこと・雑感メモ</label>
            <textarea id="memoText" rows="3" placeholder="例：〇〇プロジェクトの設計完了。障害対応で原因特定まで実施。" required></textarea>
          </div>
          <button type="submit" class="btn">メモを保存！</button>
        </form>
      </div>

      <div class="card" style="box-shadow: 6px 6px 0 var(--splat-yellow);">
        <div class="card-title" style="background: var(--splat-purple);">3. 記録メモ一覧</div>
        <div class="log-list" id="logList">
          <p style="text-align: center; color: #aaa;">まだメモがありません</p>
        </div>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="card-title" style="background: var(--splat-yellow); color: #000;">4. 評価作成</div>
        <div class="form-group">
          <label for="targetYear">対象年度</label>
          <input type="number" id="targetYear" min="2020" max="2030">
        </div>
        <div class="form-group">
          <label for="targetPeriod">対象期</label>
          <select id="targetPeriod">
            <option value="H1">上期 (4月 〜 9月)</option>
            <option value="H2">下期 (10月 〜 翌年3月)</option>
          </select>
        </div>
        <button id="generateBtn" class="btn" style="background: var(--splat-pink); color: #fff; font-size: 1.2rem;">
          自己評価を作成する！
        </button>
      </div>

      <div class="card" style="box-shadow: 6px 6px 0 var(--splat-pink);">
        <div class="card-title" style="background: var(--splat-cyan); color: #000;">RESULT</div>
        <div class="output-box" id="outputArea">（「自己評価を作成する！」を押すとここに文章が生成されます）</div>
        <div style="margin-top: 12px; text-align: right;">
          <button id="copyBtn" class="btn btn-secondary" style="display: none; width: auto;">結果をコピー！</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY_LOGS = 'eval_memo_logs';
  const STORAGE_KEY_APIKEY = 'eval_gemini_apikey';

  let memoLogs = JSON.parse(localStorage.getItem(STORAGE_KEY_LOGS) || '[]');
  let editingId = null;

  const apiKeyInput = document.getElementById('apiKey');
  const memoForm = document.getElementById('memoForm');
  const memoDateInput = document.getElementById('memoDate');
  const memoTextInput = document.getElementById('memoText');
  const logList = document.getElementById('logList');
  const targetYearInput = document.getElementById('targetYear');
  const targetPeriodSelect = document.getElementById('targetPeriod');
  const generateBtn = document.getElementById('generateBtn');
  const outputArea = document.getElementById('outputArea');
  const copyBtn = document.getElementById('copyBtn');

  window.addEventListener('DOMContentLoaded', () => {
    memoDateInput.value = new Date().toISOString().split('T')[0];

    const now = new Date();
    const currentMonth = now.getMonth() + 1;
    const currentYear = currentMonth < 4 ? now.getFullYear() - 1 : now.getFullYear();
    targetYearInput.value = currentYear;
    targetPeriodSelect.value = (currentMonth >= 4 && currentMonth <= 9) ? 'H1' : 'H2';

    apiKeyInput.value = localStorage.getItem(STORAGE_KEY_APIKEY) || '';

    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem(STORAGE_KEY_APIKEY, apiKeyInput.value.trim());
    });

    renderLogs();
  });

  memoForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const date = memoDateInput.value;
    const text = memoTextInput.value.trim();

    if (!date || !text) return;

    memoLogs.unshift({ id: Date.now(), date, text });
    localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(memoLogs));

    memoTextInput.value = '';
    renderLogs();
  });

  window.enableEdit = function(id) {
    editingId = id;
    renderLogs();
  };

  window.cancelEdit = function() {
    editingId = null;
    renderLogs();
  };

  window.saveEdit = function(id) {
    const editText = document.getElementById(`edit-input-${id}`).value.trim();
    if (!editText) return;

    memoLogs = memoLogs.map(log => {
      if (log.id === id) {
        return { ...log, text: editText };
      }
      return log;
    });

    localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(memoLogs));
    editingId = null;
    renderLogs();
  };

  window.deleteLog = function(id) {
    memoLogs = memoLogs.filter(log => log.id !== id);
    localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(memoLogs));
    renderLogs();
  };

  function renderLogs() {
    if (memoLogs.length === 0) {
      logList.innerHTML = '<p style="text-align: center; color: #aaa;">まだメモがありません</p>';
      return;
    }

    logList.innerHTML = memoLogs.map(log => {
      if (log.id === editingId) {
        return `
          <div class="log-item" style="border-color: var(--splat-yellow);">
            <div style="flex-grow: 1;">
              <div class="log-date">${log.date} (編集中のメモ)</div>
              <textarea id="edit-input-${log.id}" class="edit-textarea" rows="3">${escapeHtml(log.text)}</textarea>
              <div class="btn-group">
                <button class="btn btn-edit" onclick="saveEdit(${log.id})">保存</button>
                <button class="btn btn-danger" onclick="cancelEdit()">キャンセル</button>
              </div>
            </div>
          </div>
        `;
      } else {
        return `
          <div class="log-item">
            <div style="flex-grow: 1;">
              <div class="log-date">▶ ${log.date}</div>
              <div class="log-content">${escapeHtml(log.text)}</div>
            </div>
            <div class="btn-group">
              <button class="btn btn-edit" onclick="enableEdit(${log.id})">編集</button>
              <button class="btn btn-danger" onclick="deleteLog(${log.id})">削除</button>
            </div>
          </div>
        `;
      }
    }).join('');
  }

  function escapeHtml(str) {
    return str.replace(/[&< me>"]/g, (tag) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[tag] || tag));
  }

  function filterLogsByPeriod(year, period) {
    const startDate = period === 'H1' ? `${year}-04-01` : `${year}-10-01`;
    const endDate = period === 'H1' ? `${year}-09-30` : `${parseInt(year) + 1}-03-31`;

    return memoLogs.filter(log => log.date >= startDate && log.date <= endDate);
  }

  generateBtn.addEventListener('click', async () => {
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) {
      alert('Gemini API Key を入力してください！');
      return;
    }

    const year = targetYearInput.value;
    const period = targetPeriodSelect.value;
    const periodName = period === 'H1' ? '上期 (4月〜9月)' : '下期 (10月〜翌年3月)';

    const targetLogs = filterLogsByPeriod(year, period);

    if (targetLogs.length === 0) {
      alert(`指定された期間（${year}年度 ${periodName}）のメモが見つかりませんでした。`);
      return;
    }

    const logsText = targetLogs
      .slice()
      .reverse()
      .map(log => `[${log.date}] ${log.text}`)
      .join('\n');

    const prompt = `あなたはプロフェッショナルなビジネスパーソンおよび評価者です。
以下は、社員が日頃記録した業務メモ（${year}年度 ${periodName}）です。
このメモの内容を整理し、会社提出用の「半期自己評価・振り返り文章」を作成してください。

### 日々のメモ内容:
${logsText}

### 出力フォーマット指示:
1. **業務実績・取り組み成果の要約**
   - 実施した主要業務やプロジェクトをカテゴリごとに整理し、客観的・構造的にまとめてください。
2. **成果と課題・工夫した点**
   - 取り組みにおける工夫や成果、直面した課題への対応を箇条書き等でわかりやすく記載してください。
3. **総括（自己評価まとめ）**
   - この半期の振り返りと、今後の改善点や次期に向けた意気込みをフォーマルなビジネス文体（敬体：〜です・〜ます）でまとめてください。`;

    // イカバトルアニメーションを表示
    outputArea.innerHTML = `
      <div class="splat-loading">
        <div class="squid-battle">
          <span class="squid-left">🦑</span>
          <span class="ink-ball ink-pink">💥</span>
          <span class="ink-ball ink-green">💦</span>
          <span class="squid-right">🦑</span>
        </div>
        <div class="loading-text">AIがインクを塗りまくり中...！</div>
      </div>
    `;
    generateBtn.disabled = true;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      });

      const data = await response.json();
      if (data.error) {
        throw new Error(data.error.message || 'APIエラー');
      }

      const generatedText = data.candidates[0].content.parts[0].text;
      outputArea.textContent = generatedText;
      copyBtn.style.display = 'inline-block';
    } catch (err) {
      outputArea.textContent = 'エラーが発生しました: ' + err.message;
    } finally {
      generateBtn.disabled = false;
    }
  });

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(outputArea.textContent).then(() => {
      alert('クリップボードにコピーしました！');
    });
  });
</script>
</body>
</html>
